<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Listing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>My Store</h1>
        <p>Discover products for everyday life</p>
    </header>

    <main class="container">
        <h2>Our Products</h2>

        <section class="product-list">

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300?text=Headphones"
                    alt="Headphones"
                >
                <h3>Wireless Headphones</h3>
                <p class="price">₹1,499</p>
                <button type="button">View Product</button>
            </article>

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300?text=Smartwatch"
                    alt="Smartwatch"
                >
                <h3>Smartwatch</h3>
                <p class="price">₹2,499</p>
                <button type="button">View Product</button>
            </article>

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300?text=Backpack"
                    alt="Backpack"
                >
                <h3>Travel Backpack</h3>
                <p class="price">₹999</p>
                <button type="button">View Product</button>
            </article>

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300?text=Keyboard"
                    alt="Keyboard"
                >
                <h3>Mechanical Keyboard</h3>
                <p class="price">₹1,899</p>
                <button type="button">View Product</button>
            </article>

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300?text=Speaker"
                    alt="Bluetooth speaker"
                >
                <h3>Bluetooth Speaker</h3>
                <p class="price">₹1,299</p>
                <button type="button">View Product</button>
            </article>

            <article class="product-card">
                <img
                    src="https://placehold.co/400x300?text=Mouse"
                    alt="Wireless mouse"
                >
                <h3>Wireless Mouse</h3>
                <p class="price">₹699</p>
                <button type="button">View Product</button>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Store. All rights reserved.</p>
    </footer>

</body>
</html>
